<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Bazar Chart</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff !important;
            margin: 0;
            padding: 5px;
            text-align: center;
        }
        /* चार्ट का नाम (Title) */
        h2.chart-title {
            color: #800080;
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: bold;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            background-color: #ffffff !important;
            border: 2px solid #800080 !important; /* पर्पल बॉर्डर */
        }
        th, td {
            border: 1px solid #800080 !important;
            padding: 8px 2px;
            font-size: 17px;
            text-align: center;
            font-weight: 900;
            background-color: #ffffff !important;
        }
        th {
            background-color: #f8f9fa !important;
            color: #800080;
            font-size: 14px;
        }
        .date-col {
            color: #333333 !important;
            font-size: 10px;
            font-weight: bold;
            width: 60px;
            line-height: 1.2;
            padding: 4px 1px;
            vertical-align: middle;
        }
        /* नॉर्मल नंबर (सिर्फ काले) */
        .normal-num {
            color: #000000 !important;
        }
        /* रेड जोड़ी (सिर्फ लाल) */
        .red-num {
            color: #ff0000 !important;
        }
        /* डैश और खाली जगह */
        .dash-num {
            color: #000000 !important;
        }
    </style>
</head>
<body>

    <!-- सबसे ऊपर चार्ट का नाम -->
    <h2 class="chart-title">Main Bazar Chart</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                </tr>
            </thead>
            <!-- एडमिन पैनल का डेटा और बॉक्स यहाँ जावास्क्रिप्ट (JS) द्वारा अपने आप जनरेट होंगे -->
            <tbody id="auto-chart-body">
            </tbody>
        </table>
    </div>

    <script>
        // 1. आपका पूरा डेटा (Main Bazar - 5 Days a week)
        const baseData = [
            "83","46","62","32","49",
            "14","21","79","69","13",
            "52","45","59","78","87",
            "13","73","25","36","15",
            "97","60","40","94","46",
            "77","55","96","04","**",
            "76","71","14","50","76",
            "51","83","57","51","87",
            "54","44","37","23","30",
            "47","42","86","91","51",
            "09","93","15","59","19",
            "83","31","93","03","17",
            "04","62","14","66","52",
            "19","68","88","66","74",
            "00","94","47","88","49",
            "**","**","**","**","**",
            "85","59","66","12","47",
            "11","86","94","72","79",
            "04","37","36","25","25",
            "44","20","66","72","76",
            "92","84","81","65","46",
            "82","14","65","70","59",
            "07","05","05","78","28",
            "77","79","34","03","90",
            "71","81","15","39","06",
            "67","34","54","63","65",
            "01","04","21","47","48",
            "63","37","20","45","02",
            "71","56","80","12","45",
            "**","30","53","47","57",
            "97","21","61","67","80",
            "99","80","96","86","80",
            "85","85","54","68","39",
            "32","82","32","64","76",
            "99","43","**","49","59",
            "94","20","23","79","72",
            "11","25","60","43","55",
            "41","94","80","13","26",
            "49","26","67","57","31",
            "92","91","65","98","91",
            "23","51","53","32","62",
            "65","03","66","57","51",
            "95","33","54","07","88",
            "96","77","**","41","56",
            "61","29","80","28","64",
            "44","68","11","00","98",
            "02","49","17","93","81",
            "17","01","12","27","51",
            "43","18","62","43","78",
            "11","84","77","96","43",
            "39","29","40","08","65",
            "38","36","54","35","59",
            "80","02","81","84","81",
            "51","00","25","72","04",
            "42","72","71","13","24" // <--- जब नया नंबर आए, तो यहाँ कॉमा (,) लगाकर अगला नंबर लिख देना
        ];

        // 2. एडमिन पैनल का डेटाबेस नाम (Main Bazar के लिए खास नाम 'mainBazarAdminData')
        let adminData = JSON.parse(localStorage.getItem('mainBazarAdminData')) || [];
        let allData = baseData.concat(adminData);

        // 3. 5-दिन वाले चार्ट का ऑटोमैटिक जनरेटर
        function generateDynamicChart() {
            const tbody = document.getElementById('auto-chart-body');
            tbody.innerHTML = '';
            
            // शुरू होने की तारीख (07 जुलाई 2025)
            // (महीना 0 से शुरू होता है इसलिए जुलाई = 6)
            let startDate = new Date(2025, 6, 7); 

            // लूप को 5-5 दिन के हिसाब से चलाया है (क्योंकि यह 5 दिन का गेम है)
            for (let i = 0; i < allData.length; i += 5) {
                let tr = document.createElement('tr');

                // ऑटोमैटिक डेट (Date) बनाना 
                let weekStart = new Date(startDate);
                weekStart.setDate(weekStart.getDate() + (i / 5) * 7);
                
                // हफ्ता शुक्रवार को खत्म होगा (सोमवार + 4 दिन = शुक्रवार)
                let weekEnd = new Date(weekStart);
                weekEnd.setDate(weekStart.getDate() + 4); 

                let startStr = ('0' + weekStart.getDate()).slice(-2) + '/' + ('0' + (weekStart.getMonth()+1)).slice(-2) + '/' + String(weekStart.getFullYear()).slice(-2);
                let endStr = ('0' + weekEnd.getDate()).slice(-2) + '/' + ('0' + (weekEnd.getMonth()+1)).slice(-2) + '/' + String(weekEnd.getFullYear()).slice(-2);

                let tdDate = document.createElement('td');
                tdDate.className = 'date-col';
                tdDate.innerHTML = startStr + '<br>to<br>' + endStr;
                tr.appendChild(tdDate);

                // सोमवार से शुक्रवार (5 दिन) के बॉक्स
                for (let j = 0; j < 5; j++) {
                    let val = allData[i + j];
                    let td = document.createElement('td');
                    let span = document.createElement('span');

                    if (val === undefined || val === '' || val === '--') {
                        span.innerText = '--';
                        span.className = 'dash-num';
                    } else if (val === '**') {
                        span.innerText = val;
                        span.className = 'red-num';
                    } else {
                        span.innerText = val;
                        // ऑटोमैटिक रेड जोड़ी (0 या 5 का अंतर) पकड़ने का लॉजिक
                        if (val.length === 2 && !isNaN(val)) {
                            let diff = Math.abs(parseInt(val[0]) - parseInt(val[1]));
                            if (diff === 0 || diff === 5) {
                                span.className = 'red-num';
                            } else {
                                span.className = 'normal-num';
                            }
                        } else {
                            span.className = 'normal-num';
                        }
                    }
                    td.appendChild(span);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        // चार्ट को लोड करना
        generateDynamicChart();
    </script>

</body>
</html>
