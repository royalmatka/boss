        // मंडे टू सैटरडे की डेट निकालने का सिस्टम 
        function getWeekRangeAndDay(dateStr) {
            let parts = dateStr.split('-');
            let d = new Date(parts[0], parts[1]-1, parts[2]); 
            let day = d.getDay(); 
            
            // सिर्फ रविवार (0) को ब्लॉक किया है
            if (day === 0) return null; 

            let diff = d.getDate() - day + 1;
            let monday = new Date(d.setDate(diff));
            let saturday = new Date(monday);
            saturday.setDate(monday.getDate() + 5);

            let format = (date) => {
                let dd = String(date.getDate()).padStart(2, '0');
                let mm = String(date.getMonth() + 1).padStart(2, '0');
                let yy = String(date.getFullYear()).slice(-2);
                return `${dd}/${mm}/${yy}`;
            };
            return { weekRange: `${format(monday)} to ${format(saturday)}`, dayIndex: day };
        }

        function extractJodi(resultStr) {
            if (!resultStr) return "--";
            if (resultStr.includes("***") && resultStr.length > 5) return "**"; 
            if (resultStr.toUpperCase() === "CLOSE" || resultStr.toUpperCase() === "HOLIDAY") return "**";
            let parts = resultStr.split('-');
            if (parts.length === 3) return parts[1]; 
            if (parts.length === 1 && resultStr.length === 2) return resultStr;
            return resultStr.substring(0, 2); 
        }

        // नया हफ्ता आने पर ऑटोमैटिक रो जोड़ने वाला PRO फंक्शन
        async function loadChart() {
            let rows = [...defaultRows];
            try {
                let res = await fetch(dbURL + "/history/" + gameId + ".json");
                let historyData = await res.json();
                
                if (historyData) {
                    let dates = Object.keys(historyData).sort(); 
                    dates.forEach(dateStr => {
                        let info = getWeekRangeAndDay(dateStr);
                        if (!info) return; 
                        
                        let jodi = extractJodi(historyData[dateStr].result);
                        let rowIndex = rows.findIndex(r => r[0] === info.weekRange);
                        
                        if (rowIndex !== -1) {
                            rows[rowIndex][info.dayIndex] = jodi; 
                        } else {
                            let newRow = [info.weekRange, "--", "--", "--", "--", "--", "--"];
                            newRow[info.dayIndex] = jodi;
                            rows.push(newRow);
                        }
                    });
                }
            } catch(e) { console.log("Firebase Load Error:", e); }

            let tbody = document.getElementById('chartBody');
            let html = "";
            rows.forEach(rowData => {
                html += "<tr>";
                rowData.forEach((cell, index) => {
                    let cellStr = cell.toString().trim();
                    if (index === 0) {
                        let formattedDate = cellStr.replace(/ to /gi, "<br>to<br>");
                        html += `<td class="date-cell">${formattedDate}</td>`;
                    } else {
                        if (cellStr.length === 1 && cellStr !== "" && cellStr !== "*" && cellStr !== "--" && !isNaN(cellStr)) {
                            cellStr = "0" + cellStr;
                        }
                        
                        let isRed = false;
                        const redJodis = ["00","11","22","33","44","55","66","77","88","99", "05","50","16","61","27","72","38","83","49","94"];
                        if(redJodis.includes(cellStr) || cellStr === "**") { isRed = true; }

                        if(isRed) { html += `<td class="number-cell red-text">${cellStr}</td>`; } 
                        else { html += `<td class="number-cell">${cellStr}</td>`; }
                    }
                });
                html += "</tr>";
            });
            tbody.innerHTML = html;
        }

        window.onload = loadChart;
