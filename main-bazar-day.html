<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Bazar Day Chart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff !important;
            margin: 0;
            padding: 5px;
            text-align: center;
        }
        /* चार्ट का नाम (Title) */
        h2.chart-title {
            color: #800080;
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: bold;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            background-color: #ffffff !important;
            border: 2px solid #800080 !important; /* पर्पल बॉर्डर */
        }
        th, td {
            border: 1px solid #800080 !important;
            padding: 8px 2px;
            font-size: 17px;
            text-align: center;
            font-weight: 900;
            background-color: #ffffff !important;
        }
        th {
            background-color: #f8f9fa !important;
            color: #800080;
            font-size: 14px;
        }
        .date-col {
            color: #333333 !important;
            font-size: 10px;
            font-weight: bold;
            width: 60px;
            line-height: 1.2;
            padding: 4px 1px;
            vertical-align: middle;
        }
        /* नॉर्मल नंबर (सिर्फ काले) */
        .normal-num {
            color: #000000 !important;
        }
        /* रेड जोड़ी (सिर्फ लाल) */
        .red-num {
            color: #ff0000 !important;
        }
        /* डैश और खाली जगह */
        .dash-num {
            color: #000000 !important;
        }
    </style>
</head>
<body>

    <!-- सबसे ऊपर चार्ट का नाम -->
    <h2 class="chart-title">Main Bazar Day Chart</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                    <th>Sat</th>
                </tr>
            </thead>
            <!-- एडमिन पैनल का डेटा और बॉक्स यहाँ जावास्क्रिप्ट (JS) द्वारा अपने आप जनरेट होंगे -->
            <tbody id="auto-chart-body">
            </tbody>
        </table>
    </div>

    <script>
        // 1. आपका पूरा डेटा (Main Bazar Day - 6 Days a week)
        const baseData = [
            "16","81","38","15","66","04",
            "69","18","51","27","16","46",
            "54","58","44","20","30","91",
            "54","85","39","09","11","71",
            "05","02","80","55","64","31",
            "34","78","06","73","18","25",
            "98","26","42","25","86","24",
            "95","39","91","15","23","59",
            "82","30","35","66","36","00",
            "12","61","53","34","62","21",
            "57","67","69","44","88","89",
            "41","85","16","21","61","47",
            "38","91","40","94","64","89",
            "50","73","91","40","12","88",
            "18","29","65","79","31","52",
            "78","60","44","04","10","75",
            "61","32","54","05","04","34",
            "52","42","91","71","48","04",
            "55","35","34","62","73","50",
            "18","27","74","10","44","84",
            "20","71","19","27","67","06",
            "92","93","46","26","33","51",
            "77","11","85","07","08","24",
            "24","82","30","40","93","31",
            "20","99","11","29","80","23",
            "14","21","84","32","79","58",
            "83","08","22","92","19","64",
            "00","32","48","68","22","90",
            "73","38","47","40","66","82",
            "14","96","60","17","50","12",
            "27","79","32","80","84","08",
            "21","04","10","37","57","39",
            "98","48","64","85","93","00",
            "**","80","08","18","44","37",
            "35","84","99","38","86","52",
            "**","25","99","78","09","28",
            "42","88","69","80","12","61",
            "14","81","23","00","31","38",
            "82","04","17","30","50","54",
            "74","83","82","29","61","30",
            "60","94","71","02","08","47",
            "61","06","19","28","31","48",
            "10","61","13","73","37","88",
            "12","91","30","74","10","53",
            "10","84","64","18","45","30",
            "32","40","00","51","03","14",
            "21","48","22","32","32","98",
            "22","40","46","60","71","05",
            "43","71","49","61","98","19",
            "20","55","04","52","97","55",
            "02","60","48","60","28","29",
            "60","31","81","32","23","17",
            "91","20","08","18","01","12",
            "32","61","13","23","93","04",
            "21","92","31","10","69","85",
            "10" // यहाँ तक आपका डेटा है
        ];

        // 2. एडमिन पैनल का डेटाबेस नाम (इस गेम के लिए अलग रखा है ताकि डेटा मिक्स न हो)
        let adminData = JSON.parse(localStorage.getItem('mainBazarDayAdminData')) || [];
        let allData = baseData.concat(adminData);

        // 3. 6-दिन वाले चार्ट का ऑटोमैटिक जनरेटर
        function generateDynamicChart() {
            const tbody = document.getElementById('auto-chart-body');
            tbody.innerHTML = '';
            
            // शुरू होने की तारीख (07/07/2025)
            let startDate = new Date('2025-07-07'); 

            // लूप को 6-6 दिन के हिसाब से चलाया है (क्योंकि यह 6 दिन का गेम है)
            for (let i = 0; i < allData.length; i += 6) {
                let tr = document.createElement('tr');

                // ऑटोमैटिक डेट (Date) बनाना (हफ्ता 7 दिन का ही गिना जाएगा)
                let weekStart = new Date(startDate);
                weekStart.setDate(weekStart.getDate() + (i / 6) * 7);
                let weekEnd = new Date(weekStart);
                weekEnd.setDate(weekStart.getDate() + 6); // खत्म रविवार को होगा

                let startStr = ('0' + weekStart.getDate()).slice(-2) + '/' + ('0' + (weekStart.getMonth()+1)).slice(-2) + '/' + String(weekStart.getFullYear()).slice(-2);
                let endStr = ('0' + weekEnd.getDate()).slice(-2) + '/' + ('0' + (weekEnd.getMonth()+1)).slice(-2) + '/' + String(weekEnd.getFullYear()).slice(-2);

                let tdDate = document.createElement('td');
                tdDate.className = 'date-col';
                tdDate.innerHTML = startStr + '<br>to<br>' + endStr;
                tr.appendChild(tdDate);

                // सोमवार से शनिवार (6 दिन) के बॉक्स
                for (let j = 0; j < 6; j++) {
                    let val = allData[i + j];
                    let td = document.createElement('td');
                    let span = document.createElement('span');

                    if (val === undefined || val === '' || val === '--') {
                        span.innerText = '--';
                        span.className = 'dash-num';
                    } else if (val === '**') {
                        span.innerText = val;
                        span.className = 'red-num';
                    } else {
                        span.innerText = val;
                        // ऑटोमैटिक रेड जोड़ी (0 या 5 का अंतर) पकड़ने का लॉजिक
                        if (val.length === 2 && !isNaN(val)) {
                            let diff = Math.abs(parseInt(val[0]) - parseInt(val[1]));
                            if (diff === 0 || diff === 5) {
                                span.className = 'red-num';
                            } else {
                                span.className = 'normal-num';
                            }
                        } else {
                            span.className = 'normal-num';
                        }
                    }
                    td.appendChild(span);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        // चार्ट को लोड करना
        generateDynamicChart();
    </script>

</body>
</html>
