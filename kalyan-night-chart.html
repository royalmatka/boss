<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalyan Night Chart</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff !important;
            margin: 0;
            padding: 5px;
            text-align: center;
        }
        /* चार्ट का नाम (Title) */
        h2.chart-title {
            color: #800080;
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: bold;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            background-color: #ffffff !important;
            border: 2px solid #800080 !important; /* पर्पल बॉर्डर */
        }
        th, td {
            border: 1px solid #800080 !important;
            padding: 8px 2px;
            font-size: 17px;
            text-align: center;
            font-weight: 900;
            background-color: #ffffff !important;
        }
        th {
            background-color: #f8f9fa !important;
            color: #800080;
            font-size: 14px;
        }
        .date-col {
            color: #333333 !important;
            font-size: 10px;
            font-weight: bold;
            width: 60px;
            line-height: 1.2;
            padding: 4px 1px;
            vertical-align: middle;
        }
        /* नॉर्मल नंबर (सिर्फ काले) */
        .normal-num {
            color: #000000 !important;
        }
        /* रेड जोड़ी (सिर्फ लाल) */
        .red-num {
            color: #ff0000 !important;
        }
        /* डैश और खाली जगह */
        .dash-num {
            color: #000000 !important;
        }
    </style>
</head>
<body>

    <!-- सबसे ऊपर चार्ट का नाम -->
    <h2 class="chart-title">Kalyan Night Chart</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                </tr>
            </thead>
            <!-- एडमिन पैनल का डेटा और बॉक्स यहाँ जावास्क्रिप्ट (JS) द्वारा अपने आप जनरेट होंगे -->
            <tbody id="auto-chart-body">
            </tbody>
        </table>
    </div>

    <script>
        // 1. आपका पूरा डेटा (Kalyan Night - 5 Days a week)
        const baseData = [
            "87","78","33","08","28",
            "28","14","39","24","60",
            "82","54","08","95","95",
            "58","69","44","91","86",
            "84","21","92","07","79",
            "50","33","09","77","**",
            "99","70","15","06","17",
            "77","65","57","09","50",
            "81","16","52","64","79",
            "01","05","03","07","22",
            "16","48","09","44","70",
            "67","50","26","**","**",
            "19","74","93","75","78",
            "12","16","67","02","30",
            "66","63","38","05","26",
            "**","**","**","**","**",
            "33","05","25","26","40",
            "71","23","88","57","59",
            "86","99","67","59","07",
            "49","29","40","03","17",
            "47","18","00","03","86",
            "38","69","31","82","27",
            "97","19","11","19","27",
            "61","27","03","63","07",
            "86","69","92","71","97",
            "31","75","08","39","03",
            "37","95","81","01","08",
            "06","73","60","65","71",
            "73","02","49","82","91",
            "**","31","53","15","26",
            "88","89","40","66","62",
            "79","47","95","42","51",
            "33","18","93","46","41",
            "19","75","35","33","39",
            "14","50","**","24","44",
            "24","22","53","52","58",
            "99","87","18","16","45",
            "97","75","74","86","02",
            "71","44","08","16","38",
            "09","22","03","31","23",
            "60","20","62","21","68",
            "52","34","41","38","81",
            "50","76","09","80","85",
            "80","08","94","79","66",
            "96","69","20","42","39",
            "16","76","70","95","70",
            "76","22","70","83","45",
            "41","26","78","72","60",
            "71","81","31","84","28",
            "26","92","32","29","64",
            "84","62","**","**","**",
            "04","69","48","84","40",
            "08","46","84","68","22",
            "16","82","73","90","94",
            "72","15","86","36","62" // <--- जब नया नंबर आए, तो यहाँ कॉमा (,) लगाकर अगला नंबर लिख देना
        ];

        // 2. एडमिन पैनल का डेटाबेस नाम (कल्याण नाईट के लिए खास नाम 'kalyanNightAdminData')
        let adminData = JSON.parse(localStorage.getItem('kalyanNightAdminData')) || [];
        let allData = baseData.concat(adminData);

        // 3. 5-दिन वाले चार्ट का ऑटोमैटिक जनरेटर
        function generateDynamicChart() {
            const tbody = document.getElementById('auto-chart-body');
            tbody.innerHTML = '';
            
            // शुरू होने की तारीख (07 जुलाई 2025)
            // (महीना 0 से शुरू होता है इसलिए जुलाई = 6)
            let startDate = new Date(2025, 6, 7); 

            // लूप को 5-5 दिन के हिसाब से चलाया है (क्योंकि यह 5 दिन का गेम है)
            for (let i = 0; i < allData.length; i += 5) {
                let tr = document.createElement('tr');

                // ऑटोमैटिक डेट (Date) बनाना 
                let weekStart = new Date(startDate);
                weekStart.setDate(weekStart.getDate() + (i / 5) * 7);
                
                // हफ्ता शुक्रवार को खत्म होगा (सोमवार + 4 दिन = शुक्रवार)
                let weekEnd = new Date(weekStart);
                weekEnd.setDate(weekStart.getDate() + 4); 

                let startStr = ('0' + weekStart.getDate()).slice(-2) + '/' + ('0' + (weekStart.getMonth()+1)).slice(-2) + '/' + String(weekStart.getFullYear()).slice(-2);
                let endStr = ('0' + weekEnd.getDate()).slice(-2) + '/' + ('0' + (weekEnd.getMonth()+1)).slice(-2) + '/' + String(weekEnd.getFullYear()).slice(-2);

                let tdDate = document.createElement('td');
                tdDate.className = 'date-col';
                tdDate.innerHTML = startStr + '<br>to<br>' + endStr;
                tr.appendChild(tdDate);

                // सोमवार से शुक्रवार (5 दिन) के बॉक्स
                for (let j = 0; j < 5; j++) {
                    let val = allData[i + j];
                    let td = document.createElement('td');
                    let span = document.createElement('span');

                    if (val === undefined || val === '' || val === '--') {
                        span.innerText = '--';
                        span.className = 'dash-num';
                    } else if (val === '**') {
                        span.innerText = val;
                        span.className = 'red-num';
                    } else {
                        span.innerText = val;
                        // ऑटोमैटिक रेड जोड़ी (0 या 5 का अंतर) पकड़ने का लॉजिक
                        if (val.length === 2 && !isNaN(val)) {
                            let diff = Math.abs(parseInt(val[0]) - parseInt(val[1]));
                            if (diff === 0 || diff === 5) {
                                span.className = 'red-num';
                            } else {
                                span.className = 'normal-num';
                            }
                        } else {
                            span.className = 'normal-num';
                        }
                    }
                    td.appendChild(span);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        // चार्ट को लोड करना
        generateDynamicChart();
    </script>

</body>
</html>
