<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBBOSS ROYAL MATKA - Official Results</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --primary-color: #ffcc00;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --live-color: #ff3333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', 'Arial', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 10px; font-weight: bold; text-align: center; }
        
        header { padding: 20px 10px; background: linear-gradient(180deg, #222, #000); border: 3px solid var(--primary-color); margin-bottom: 10px; border-radius: 4px; }
        header h1 { color: var(--primary-color); font-size: 2.2rem; text-shadow: 2px 2px #000; text-transform: uppercase; }
        header p { font-size: 0.9rem; color: #fff; margin-top: 5px; letter-spacing: 1px; }
        
        /* नया टाइम और रिफ्रेश सेक्शन */
        .datetime-box { color: #fff; font-size: 1rem; margin-bottom: 15px; background: #222; padding: 10px; border-radius: 5px; border: 1px solid var(--primary-color); display: inline-block; width: 100%; max-width: 800px; }
        .refresh-btn { background-color: #28a745; color: white; padding: 10px 20px; font-size: 1rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .refresh-btn:hover { background-color: #218838; }

        .marquee-box { background: var(--primary-color); color: #000; padding: 8px; font-size: 1rem; margin-bottom: 20px; border-radius: 4px; overflow: hidden; max-width: 800px; margin-left: auto; margin-right: auto; }
        
        .section-title { color: var(--primary-color); background: #222; padding: 10px; border: 2px solid var(--border-color); margin: 20px auto 15px auto; text-transform: uppercase; font-size: 1.3rem; max-width: 800px; }
        .live-title { background: #330000; color: var(--live-color); border-color: var(--live-color); animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.7; } }

        .games-container { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 800px; margin: 0 auto; }
        @media (min-width: 600px) { .games-container { grid-template-columns: 1fr 1fr; } }
        
        .game-card { background-color: var(--card-bg); border: 2px solid var(--border-color); border-radius: 6px; padding: 15px; }
        .game-card.is-live { border: 2px solid var(--live-color); box-shadow: 0 0 15px rgba(255, 51, 51, 0.3); }
        .game-card.royal-brand { border: 2px solid var(--primary-color); }
        
        .game-name { color: var(--primary-color); font-size: 1.4rem; text-transform: uppercase; margin-bottom: 5px; }
        .game-time { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; }
        .game-result { font-size: 1.8rem; color: #ffffff; letter-spacing: 2px; margin: 10px 0; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .loading-spinner { width: 24px; height: 24px; border: 3px solid #333; border-top: 3px solid var(--live-color); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 1rem; color: var(--live-color); letter-spacing: 1px; }

        .chart-buttons { display: flex; justify-content: center; margin-top: 10px; }
        .btn-chart { background-color: #000; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 8px 25px; font-size: 0.85rem; cursor: pointer; text-decoration: none; border-radius: 3px; text-transform: uppercase; transition: all 0.2s; }
        .btn-chart:hover { background-color: var(--primary-color); color: #000; }
        
        footer { margin-top: 20px; padding: 20px; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header>
        <h1>★ SBBOSS ROYAL MATKA ★</h1>
        <p>FASTEST SATTA MATKA RESULTS SITE</p>
    </header>

    <!-- 👇 नया टाइम और रिफ्रेश बॉक्स 👇 -->
    <div class="datetime-box">
        <div id="currentDateTime">Loading Time...</div>
        <button class="refresh-btn" onclick="fetchLiveResults()">🔄 REFRESH NOW</button>
    </div>

    <div class="marquee-box">
        <marquee scrollamount="4">Welcome to SBBOSS ROYAL MATKA. Play Genuine, Win Genuine.</marquee>
    </div>

    <div id="live-section-wrapper" style="display: none;">
        <div class="section-title live-title">🔥 LIVE UPDATING NOW 🔥</div>
        <div class="games-container" id="live-games-box" style="margin-bottom: 30px;"></div>
    </div>

    <div class="section-title">🕒 ALL MATKA GAMES 🕒</div>
    <div class="games-container" id="all-games-box"></div>

    <footer>
        <p>© 2026 SBBOSS ROYAL MATKA - ALL RIGHTS RESERVED</p>
    </footer>

    <script>
        const dbURL = "https://sbboss-75e3f-default-rtdb.firebaseio.com";

        // चार्ट फाइलों के नाम एकदम सही सेट कर दिए गए हैं
        const defaultGames = [
            { id: "royal-morning", name: "Royal Morning", time: "10:00 AM to 11:00 AM", openMins: 600, closeMins: 660, isRoyal: true, result: "---***---", chartLink: "royal-morning-chart.html" },
            { id: "kalyan-morning", name: "Kalyan Morning", time: "12:00 PM to 02:30 PM", openMins: 720, closeMins: 870, isRoyal: false, result: "455-41-470", chartLink: "https://sattamatkadpboss.mobi/record/kalyan-morning-chart.php" },
            { id: "main-bazar-day", name: "Main Bazar Day", time: "03:35 PM to 05:35 PM", openMins: 935, closeMins: 1055, isRoyal: false, result: "189-85-140", chartLink: "https://sattamatkadpboss.mobi/record/main-bazar-day-chart.php" },
            { id: "kalyan", name: "Kalyan", time: "04:00 PM to 06:00 PM", openMins: 960, closeMins: 1080, isRoyal: false, result: "160-74-239", chartLink: "https://sattamatkadpboss.mobi/record/kalyan-chart.php" },
            { id: "royal-day", name: "Royal Day", time: "04:00 PM to 06:00 PM", openMins: 960, closeMins: 1080, isRoyal: true, result: "---***---", chartLink: "royal-day-chart.html" },
            { id: "royal-night", name: "Royal Night", time: "09:30 PM to 11:00 PM", openMins: 1290, closeMins: 1380, isRoyal: true, result: "---***---", chartLink: "royal-night-chart.html" },
            { id: "rajdhani-night", name: "Rajdhani Night", time: "09:35 PM to 11:45 PM", openMins: 1295, closeMins: 1425, isRoyal: false, result: "179-78-170", chartLink: "https://sattamatkadpboss.mobi/record/rajdhani-night-chart.php" },
            { id: "kalyan-night", name: "Kalyan Night", time: "09:40 PM to 11:40 PM", openMins: 1300, closeMins: 1420, isRoyal: false, result: "790-62-147", chartLink: "https://sattamatkadpboss.mobi/record/kalyan-night-chart.php" },
            { id: "main-bazar", name: "Main Bazar", time: "10:00 PM to 12:10 AM", openMins: 1320, closeMins: 10, isRoyal: false, result: "499-24-239", chartLink: "https://sattamatkadpboss.mobi/record/main-bazar-chart.php" }
        ];

        // घड़ी (Time) चलाने वाला कोड
        function updateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('currentDateTime').innerText = "📅 " + now.toLocaleDateString('en-IN', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Firebase से लाइव रिज़ल्ट लाने वाला कोड
        async function fetchLiveResults() {
            try {
                let response = await fetch(dbURL + "/results.json");
                let dbData = await response.json();
                if (dbData) {
                    defaultGames.forEach(game => {
                        if (dbData[game.id] && dbData[game.id].result) { game.result = dbData[game.id].result; }
                    });
                }
            } catch (error) { console.log("Live result error:", error); }
            renderGamesUI();
        }

        function renderGamesUI() {
            const liveBox = document.getElementById('live-games-box');
            const allBox = document.getElementById('all-games-box');
            const liveWrapper = document.getElementById('live-section-wrapper');
            liveBox.innerHTML = ''; allBox.innerHTML = '';

            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const currentDay = now.getDay(); 
            let hasLiveGames = false;

            defaultGames.forEach(game => {
                let isOpenLive = (currentMins >= game.openMins - 10 && currentMins <= game.openMins + 15);
                let cMins = game.closeMins < 120 ? game.closeMins + 1440 : game.closeMins;
                let curMinsClose = currentMins < 120 ? currentMins + 1440 : currentMins;
                let isCloseLive = (curMinsClose >= cMins - 10 && curMinsClose <= cMins + 15);
                let isLiveNow = isOpenLive || isCloseLive;

                if (game.id === "royal-night" && (currentDay === 0 || currentDay === 6)) { isLiveNow = false; }
                if(isLiveNow) hasLiveGames = true;

                const cardHtml = `
                    <div class="game-card ${isLiveNow ? 'is-live' : (game.isRoyal ? 'royal-brand' : '')}">
                        <div class="game-name">${game.name}</div>
                        <div class="game-time">${game.time}</div>
                        <div class="game-result">{RESULT_PLACEHOLDER}</div>
                        <div class="chart-buttons">
                            <a href="${game.chartLink}" class="btn-chart" target="_blank">Chart</a>
                        </div>
                    </div>`;

                let displayHtml = game.result;
                if (isLiveNow) {
                    let showLoading = false;
                    if (isOpenLive && (game.result === "---***---" || game.result === "")) showLoading = true;
                    else if (isCloseLive && (game.result === "---***---" || game.result.includes("***") || game.result === "")) showLoading = true;
                    if (game.result.toUpperCase() === "CLOSE" || game.result.toUpperCase() === "HOLIDAY") { showLoading = false; displayHtml = game.result; }
                    if (showLoading) displayHtml = `<div class="loading-spinner"></div> <span class="loading-text">LOADING...</span>`;
                    liveBox.innerHTML += cardHtml.replace('{RESULT_PLACEHOLDER}', displayHtml);
                }
                allBox.innerHTML += cardHtml.replace('{RESULT_PLACEHOLDER}', game.result);
            });
            liveWrapper.style.display = hasLiveGames ? 'block' : 'none';
        }

        window.onload = fetchLiveResults;
        setInterval(fetchLiveResults, 5000); 
    </script>
</body>
</html>
