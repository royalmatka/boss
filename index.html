<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBBOSS ROYAL MATKA</title>
    <style>
        /* 🔥 DPBoss Classic Theme 🔥 */
        body { font-family: 'Arial', sans-serif; background-color: #000000; color: #ffffff; margin: 0; padding: 0; }
        
        /* Header & Image Logo */
        .header { background: #000000; padding: 15px 10px; text-align: center; border-bottom: 3px solid #ffff00; box-shadow: 0 4px 15px rgba(255, 255, 0, 0.3); }
        .logo-img { max-width: 250px; width: 100%; height: auto; border-radius: 10px; border: 2px solid #ffff00; box-shadow: 0 0 15px rgba(255, 255, 0, 0.5); display: block; margin: 0 auto; background-color: #222; color: #ffff00; font-size: 14px; }
        .sub-logo { font-size: 14px; color: #ffff00; letter-spacing: 1px; margin-top: 10px; font-weight: 900; text-shadow: 1px 1px 2px #ff0000; }

        /* Notification Bar & Date */
        .notification-bar { background-color: #ff0000; color: #ffff00; padding: 10px 15px; font-size: 16px; font-weight: bold; display: flex; align-items: center; border-bottom: 2px solid #ffff00; text-shadow: 1px 1px #000; }
        .bell-icon { margin-right: 10px; animation: ring 1s infinite alternate; font-size: 18px; }
        .date-badge { background: #ffff00; color: #ff0000; padding: 4px 8px; border-radius: 5px; font-size: 13px; margin-right: 10px; white-space: nowrap; font-weight: 900; border: 1px solid #000; }
        @keyframes ring { 0% { transform: rotate(-15deg); } 100% { transform: rotate(15deg); } }

        .container { padding: 15px 10px; max-width: 600px; margin: auto; }
        
        /* Section Titles - DPBoss Style */
        .section-title { background: #ff0000; color: #ffff00; padding: 12px; font-size: 18px; font-weight: 900; text-align: center; border-radius: 25px; margin-top: 10px; margin-bottom: 20px; border: 2px solid #ffff00; text-transform: uppercase; box-shadow: 0 0 10px rgba(255, 0, 0, 0.8); text-shadow: 1px 1px 2px #000; }

        /* LIVE SECTION 1 */
        .games-grid { display: flex; flex-direction: column; gap: 20px; }
        .game-card { background: #000000; border: 2px dashed #ffff00; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 0 10px rgba(255, 255, 0, 0.2); }
        .game-name { font-size: 22px; font-weight: 900; color: #ffff00; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 1px 1px 5px rgba(255, 255, 0, 0.5); }
        
        /* 🔥 Game Time Added 🔥 */
        .game-time { font-size: 13px; font-weight: bold; color: #ffaa00; margin-bottom: 12px; text-shadow: 1px 1px #000; letter-spacing: 0.5px; }

        .game-result { font-size: 34px; font-weight: 900; color: #ffffff; margin: 10px 0; min-height: 40px; text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.4); }
        
        .waiting { color: #ffff00; font-size: 20px; animation: blink 1s infinite; text-shadow: none; }
        .auto-loading { color: #ff0000 !important; font-size: 24px; font-weight: 900; animation: blink 0.5s infinite; text-shadow: 0 0 10px #ff0000; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        /* Buttons (Smaller & Side-by-Side) */
        .btn-group { display: flex; flex-direction: row; justify-content: center; gap: 10px; margin-top: 10px; }
        .refresh-btn { background-color: #ffff00; color: #000000; border: 2px solid #ccaa00; padding: 6px 10px; font-size: 13px; font-weight: 900; border-radius: 6px; cursor: pointer; transition: 0.2s; text-transform: uppercase; width: 45%; }
        .chart-btn { background-color: #ff0000; color: #ffff00; border: 2px solid #cc0000; text-decoration: none; padding: 6px 10px; font-size: 13px; font-weight: 900; border-radius: 6px; display: inline-block; transition: 0.2s; text-transform: uppercase; text-shadow: 1px 1px #000; width: 45%; box-sizing: border-box; }

        /* HISTORY SECTION 2 (OLD RESULTS - DPBOSS GRID) */
        .history-title { background: #ffff00; color: #ff0000; border-color: #ff0000; margin-top: 30px; box-shadow: 0 0 10px rgba(255, 255, 0, 0.8); }
        
        /* 2-Column Grid for perfect mobile fit */
        .highlight-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        
        .hl-item { background: #111111; border: 1px solid #ffff00; padding: 10px 5px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(255, 255, 0, 0.2); }
        .hl-name { font-size: 13px; font-weight: 900; color: #ffff00; text-transform: uppercase; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hl-single-res { font-size: 18px; font-weight: 900; color: #ffffff; margin-top: 2px; }
    </style>
</head>
<body>

    <!-- Header with Image Logo -->
    <div class="header">
        <!-- 🔥 यहाँ मैंने आपकी नई फोटो का नाम डाल दिया है 🔥 -->
        <img src="1785392699416.png" alt="SBBOSS LOGO" class="logo-img" style="width: 250px; height: 250px; object-fit: cover;">
        <div class="sub-logo">SBBOSS FAST MATKA RESULT</div>
    </div>

    <!-- Live Notification & Date -->
    <div class="notification-bar" id="notiBar">
        <span class="bell-icon">🔔</span>
        <span class="date-badge" id="liveDate"></span>
        <marquee id="notiText" scrollamount="6" style="flex-grow: 1;">LOADING...</marquee>
    </div>

    <div class="container">
        
        <!-- SECTION 1: LIVE RESULTS -->
        <div class="section-title">🔴 LIVE FAST RESULTS 🔴</div>
        <div class="games-grid" id="gamesContainer">
            <!-- JS will inject Live Cards here -->
        </div>

        <!-- SECTION 2: OLD RESULTS (Auto Overwrite Logic) -->
        <div class="section-title history-title">📜 OLD RESULTS 📜</div>
        <div class="highlight-list" id="historyBody">
            <!-- JS will inject Old Results here -->
        </div>

    </div>

    <script>
        const databaseURL = "https://sbboss-75e3f-default-rtdb.firebaseio.com";
        
        // 🌟 TIME TABLE (यहाँ आप हर गेम के Open और Close का टाइम सेट कर सकते हैं)
        const games = [
            { id: "royal-morning", name: "ROYAL MORNING", chart: "royal-morning-chart.html", openTime: "10:00", closeTime: "11:00" },
            { id: "kalyan-morning", name: "KALYAN MORNING", chart: "kalyan-morning-chart.html", openTime: "11:40", closeTime: "12:40" },
            { id: "royal-day", name: "ROYAL DAY", chart: "royal-day-chart.html", openTime: "15:45", closeTime: "17:45" },
            { id: "main-bazar-day", name: "MAIN BAZAR DAY", chart: "main-bazar-day-chart.html", openTime: "15:35", closeTime: "17:35" },
            { id: "kalyan", name: "KALYAN", chart: "kalyan-chart.html", openTime: "16:00", closeTime: "18:00" },
            { id: "royal-night", name: "ROYAL NIGHT", chart: "royal-night-chart.html", openTime: "21:15", closeTime: "23:15" },
            { id: "kalyan-night", name: "KALYAN NIGHT", chart: "kalyan-night-chart.html", openTime: "21:40", closeTime: "23:40" },
            { id: "rajdhani-night", name: "RAJDHANI NIGHT", chart: "rajdhani-night-chart.html", openTime: "21:30", closeTime: "23:45" },
            { id: "main-bazar", name: "MAIN BAZAR", chart: "main-bazar-chart.html", openTime: "22:00", closeTime: "24:10" }
        ];

        // 1. लाइव डेट सेट करें
        function setLiveDate() {
            let today = new Date();
            let options = { day: '2-digit', month: 'short', year: 'numeric' };
            document.getElementById('liveDate').innerText = today.toLocaleDateString('en-IN', options).toUpperCase();
        }

        // 🔥 24-घंटे वाले टाइम को AM/PM में बदलने का लॉजिक
        function formatAMPM(time24) {
            if(!time24) return "";
            let [h, m] = time24.split(':');
            let hours = parseInt(h);
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; // 0 को 12 बना देगा
            let formattedHours = hours < 10 ? '0' + hours : hours;
            return `${formattedHours}:${m} ${ampm}`;
        }

        // 2. ऑटोमैटिक लोडिंग लॉजिक (10 मिनट पहले)
        function isTimeForAutoLoading(timeStr, lastUpdatedAt) {
            if(!timeStr) return false;
            let now = new Date();
            let [hours, minutes] = timeStr.split(':');
            let targetTime = new Date();
            targetTime.setHours(hours, minutes, 0, 0);

            let diffMins = (targetTime - now) / 60000;
            
            if (diffMins <= 10 && diffMins >= -30) {
                if(lastUpdatedAt) {
                    let updateTime = new Date(lastUpdatedAt);
                    let windowStartTime = new Date(targetTime.getTime() - (10 * 60000));
                    if(updateTime > windowStartTime) return false; 
                }
                return true; 
            }
            return false;
        }

        // 3. पेज का स्ट्रक्चर (LIVE BOXES WITH TIME)
        function initPage() {
            setLiveDate();
            const container = document.getElementById('gamesContainer');
            let html = '';
            games.forEach(game => {
                let openDisplay = formatAMPM(game.openTime);
                let closeDisplay = formatAMPM(game.closeTime);

                html += `
                <div class="game-card">
                    <div class="game-name">${game.name}</div>
                    <div class="game-time">[ ${openDisplay} TO ${closeDisplay} ]</div>
                    <div class="game-result" id="res-${game.id}"><span class="waiting">LOADING...</span></div>
                    <div class="btn-group">
                        <button class="refresh-btn" onclick="fetchSingleGame('${game.id}', '${game.openTime}', '${game.closeTime}')">🔄 REFRESH</button>
                        <a href="${game.chart}" class="chart-btn">📊 CHART</a>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            fetchAllData(); 
        }

        // 4. नोटिफिकेशन मंगाना
        async function fetchNotification() {
            try {
                let res = await fetch(`${databaseURL}/notification.json?t=${new Date().getTime()}`);
                let data = await res.json();
                let notiText = document.getElementById('notiText');
                if (data && data.message && data.message.trim() !== "") {
                    notiText.innerText = data.message;
                } else {
                    notiText.innerText = "WELCOME TO SBBOSS ROYAL MATKA - FASTEST RESULT APP";
                }
            } catch (e) { }
        }

        // 5. सेक्शन 1: लाइव रिज़ल्ट मंगाना
        async function fetchSingleGame(gameId, openTime, closeTime) {
            let resBox = document.getElementById(`res-${gameId}`);
            try {
                let res = await fetch(`${databaseURL}/results/${gameId}.json?t=${new Date().getTime()}`);
                let data = await res.json();
                
                let showLoading = false;
                if(data && data.updatedAt) {
                    showLoading = isTimeForAutoLoading(openTime, data.updatedAt) || isTimeForAutoLoading(closeTime, data.updatedAt);
                } else {
                    showLoading = isTimeForAutoLoading(openTime, null) || isTimeForAutoLoading(closeTime, null);
                }

                if (showLoading) {
                    resBox.innerHTML = '<span class="auto-loading">LOADING...</span>';
                    return;
                }

                if (data && data.result) {
                    let txt = data.result.trim().toUpperCase();
                    if (txt.includes("WAIT") || txt.includes("LOAD")) {
                        resBox.innerHTML = `<span class="waiting">${data.result}</span>`;
                    } else {
                        resBox.innerHTML = data.result; 
                    }
                } else {
                    resBox.innerHTML = '<span class="waiting">WAITING...</span>';
                }
            } catch (e) { }
        }

        // 6. 🔥 सेक्शन 2: OLD RESULTS 
        async function loadHistorySection() {
            let tbody = document.getElementById('historyBody');
            
            let today = new Date();
            let yest = new Date(); yest.setDate(yest.getDate() - 1);
            let todayStr = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, '0') + "-" + String(today.getDate()).padStart(2, '0');
            let yestStr = yest.getFullYear() + "-" + String(yest.getMonth() + 1).padStart(2, '0') + "-" + String(yest.getDate()).padStart(2, '0');

            let html = '';
            for (let game of games) {
                let finalRes = "***";
                let yRes = null, tRes = null;
                
                // कल का रिज़ल्ट ढूँढो
                try {
                    let reqY = await fetch(`${databaseURL}/history/${game.id}/${yestStr}.json?t=${new Date().getTime()}`);
                    let dataY = await reqY.json();
                    if(dataY && dataY.result) {
                        let txt = dataY.result.toUpperCase();
                        if(!txt.includes("WAIT") && !txt.includes("LOAD")) yRes = dataY.result;
                    }
                } catch(e){}
                
                // आज का रिज़ल्ट ढूँढो
                try {
                    let reqT = await fetch(`${databaseURL}/history/${game.id}/${todayStr}.json?t=${new Date().getTime()}`);
                    let dataT = await reqT.json();
                    if(dataT && dataT.result) {
                        let txt = dataT.result.toUpperCase();
                        if(!txt.includes("WAIT") && !txt.includes("LOAD")) tRes = dataT.result;
                    }
                } catch(e){}

                // अगर आज का नंबर है तो छापो, नहीं तो कल का ही रहने दो
                if (tRes) {
                    finalRes = tRes;
                } else if (yRes) {
                    finalRes = yRes;
                }

                html += `
                <div class="hl-item">
                    <div class="hl-name">${game.name}</div>
                    <div class="hl-single-res">${finalRes}</div>
                </div>`;
            }
            tbody.innerHTML = html;
        }

        function fetchAllData() {
            fetchNotification();
            games.forEach(g => fetchSingleGame(g.id, g.openTime, g.closeTime));
            loadHistorySection();
        }

        window.onload = () => {
            initPage();
            setInterval(() => {
                games.forEach(g => fetchSingleGame(g.id, g.openTime, g.closeTime));
            }, 60000);
        };
    </script>
</body>
</html>
