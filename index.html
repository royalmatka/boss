<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBBOSS ROYAL MATKA</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 0; }
        
        /* Header & Logo */
        .header { background: linear-gradient(45deg, #3b0066, #6a1b9a); padding: 20px 10px; text-align: center; border-bottom: 3px solid #ffd700; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .logo { font-size: 30px; font-weight: 900; color: #ffd700; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); letter-spacing: 1px; margin: 0; }
        .sub-logo { font-size: 13px; color: #ffffff; letter-spacing: 2px; margin-top: 5px; font-weight: bold; }

        /* Notification Bar & Date */
        .notification-bar { background-color: #dc3545; color: #fff; padding: 10px 15px; font-size: 16px; font-weight: bold; display: flex; align-items: center; border-bottom: 2px solid #fff; }
        .bell-icon { margin-right: 10px; animation: ring 1s infinite alternate; font-size: 18px; }
        .date-badge { background: #ffc107; color: #000; padding: 3px 8px; border-radius: 5px; font-size: 12px; margin-right: 10px; white-space: nowrap; }
        @keyframes ring { 0% { transform: rotate(-15deg); } 100% { transform: rotate(15deg); } }

        .container { padding: 20px 15px; max-width: 600px; margin: auto; }
        .section-title { background: #28a745; color: white; padding: 12px; font-size: 18px; font-weight: bold; text-align: center; border-radius: 8px; margin-top: 10px; margin-bottom: 20px; border: 2px solid #1e7e34; text-transform: uppercase; }

        /* LIVE SECTION 1 */
        .games-grid { display: flex; flex-direction: column; gap: 20px; }
        .game-card { background: #1e1e2f; border: 2px solid #6a1b9a; border-radius: 12px; padding: 20px 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .game-name { font-size: 24px; font-weight: 900; color: #ffd700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .game-result { font-size: 36px; font-weight: 900; color: #00ffcc; margin: 15px 0; min-height: 45px; text-shadow: 1px 1px 5px rgba(0, 255, 204, 0.4); }
        .waiting { color: #ffeb3b; font-size: 22px; animation: blink 1s infinite; }
        .auto-loading { color: #ff5252 !important; font-size: 24px; animation: blink 0.5s infinite; text-shadow: 0 0 10px red; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Buttons */
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .refresh-btn { background-color: #28a745; color: white; border: 2px solid #1e7e34; padding: 12px; font-size: 16px; font-weight: 900; border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .chart-btn { background-color: #ffc107; color: #000; border: 2px solid #d39e00; text-decoration: none; padding: 12px; font-size: 16px; font-weight: 900; border-radius: 8px; display: block; transition: 0.2s; text-transform: uppercase; }

        /* HISTORY SECTION 2 */
        .history-title { background: #007bff; border-color: #0056b3; margin-top: 40px; }
        .history-table { width: 100%; border-collapse: collapse; background: #1e1e2f; border-radius: 8px; overflow: hidden; border: 2px solid #444; }
        .history-table th, .history-table td { padding: 12px 10px; text-align: center; border: 1px solid #444; font-weight: bold; }
        .history-table th { background: #333; color: #ffeb3b; font-size: 14px; text-transform: uppercase; }
        .history-table td:first-child { color: #fff; text-align: left; font-size: 14px; }
        .yest-res { color: #ff9800; font-size: 16px; }
        .today-res { color: #00ffcc; font-size: 18px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1 class="logo">👑 SBBOSS ROYAL MATKA 👑</h1>
        <div class="sub-logo">FASTEST SATTA MATKA RESULTS SITE</div>
    </div>

    <!-- Live Notification & Date -->
    <div class="notification-bar" id="notiBar">
        <span class="bell-icon">🔔</span>
        <span class="date-badge" id="liveDate"></span>
        <marquee id="notiText" scrollamount="6" style="flex-grow: 1;">LOADING...</marquee>
    </div>

    <div class="container">
        
        <!-- SECTION 1: LIVE RESULTS -->
        <div class="section-title">🔴 LIVE FAST RESULTS</div>
        <div class="games-grid" id="gamesContainer">
            <!-- JS will inject Live Cards here -->
        </div>

        <!-- SECTION 2: YESTERDAY & TODAY SUMMARY -->
        <div class="section-title history-title">📜 YESTERDAY & TODAY SUMMARY</div>
        <table class="history-table">
            <thead>
                <tr>
                    <th>Game Name</th>
                    <th>Yesterday</th>
                    <th>Today</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <!-- JS will inject History Rows here -->
            </tbody>
        </table>

    </div>

    <script>
        const databaseURL = "https://sbboss-75e3f-default-rtdb.firebaseio.com";
        
        // 🌟 TIME TABLE (यहाँ आप हर गेम के Open और Close का टाइम सेट कर सकते हैं)
        // टाइम को 24-घंटे (Military Time) के फॉर्मेट में लिखें। जैसे 4:00 PM = "16:00"
        const games = [
            { id: "royal-morning", name: "ROYAL MORNING", chart: "royal-morning-chart.html", openTime: "10:00", closeTime: "11:00" },
            { id: "kalyan-morning", name: "KALYAN MORNING", chart: "kalyan-morning-chart.html", openTime: "11:00", closeTime: "12:05" },
            { id: "royal-day", name: "ROYAL DAY", chart: "royal-day-chart.html", openTime: "13:00", closeTime: "14:00" },
            { id: "main-bazar-day", name: "MAIN BAZAR DAY", chart: "main-bazar-day-chart.html", openTime: "15:30", closeTime: "17:30" },
            { id: "kalyan", name: "KALYAN", chart: "kalyan-chart.html", openTime: "16:00", closeTime: "18:00" },
            { id: "royal-night", name: "ROYAL NIGHT", chart: "royal-night-chart.html", openTime: "19:00", closeTime: "20:00" },
            { id: "kalyan-night", name: "KALYAN NIGHT", chart: "kalyan-night-chart.html", openTime: "21:00", closeTime: "23:05" },
            { id: "rajdhani-night", name: "RAJDHANI NIGHT", chart: "rajdhani-night-chart.html", openTime: "21:30", closeTime: "23:45" },
            { id: "main-bazar", name: "MAIN BAZAR", chart: "main-bazar-chart.html", openTime: "21:35", closeTime: "23:55" }
        ];

        // 1. सेट लाइव डेट (Today's Date)
        function setLiveDate() {
            let today = new Date();
            let options = { day: '2-digit', month: 'short', year: 'numeric' };
            document.getElementById('liveDate').innerText = today.toLocaleDateString('en-IN', options).toUpperCase();
        }

        // 2. ऑटोमैटिक लोडिंग लॉजिक (10 मिनट पहले)
        function isTimeForAutoLoading(timeStr, lastUpdatedAt) {
            if(!timeStr) return false;
            let now = new Date();
            let [hours, minutes] = timeStr.split(':');
            let targetTime = new Date();
            targetTime.setHours(hours, minutes, 0, 0);

            // टाइम का अंतर (मिनटों में)
            let diffMins = (targetTime - now) / 60000;
            
            // अगर टाइम 10 मिनट बचा है या टाइम हो चुका है (अपडेट होने तक)
            if (diffMins <= 10 && diffMins >= -30) {
                // अगर एडमिन ने रिज़ल्ट डाल दिया है, तो लोडिंग हटा दो
                if(lastUpdatedAt) {
                    let updateTime = new Date(lastUpdatedAt);
                    let windowStartTime = new Date(targetTime.getTime() - (10 * 60000));
                    if(updateTime > windowStartTime) return false; // नया रिज़ल्ट आ गया!
                }
                return true; // रिज़ल्ट नहीं आया, लोडिंग दिखाओ
            }
            return false;
        }

        // 3. पेज का स्ट्रक्चर बनाना
        function initPage() {
            setLiveDate();
            const container = document.getElementById('gamesContainer');
            let html = '';
            games.forEach(game => {
                html += `
                <div class="game-card">
                    <div class="game-name">${game.name}</div>
                    <div class="game-result" id="res-${game.id}"><span class="waiting">LOADING...</span></div>
                    <div class="btn-group">
                        <button class="refresh-btn" onclick="fetchSingleGame('${game.id}', '${game.openTime}', '${game.closeTime}')">🔄 REFRESH NOW</button>
                        <a href="${game.chart}" class="chart-btn">📊 CHART</a>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            fetchAllData(); 
        }

        // 4. नोटिफिकेशन मंगाना
        async function fetchNotification() {
            try {
                let res = await fetch(`${databaseURL}/notification.json?t=${new Date().getTime()}`);
                let data = await res.json();
                let notiText = document.getElementById('notiText');
                if (data && data.message && data.message.trim() !== "") {
                    notiText.innerText = data.message;
                } else {
                    notiText.innerText = "WELCOME TO SBBOSS ROYAL MATKA - FASTEST RESULT APP";
                }
            } catch (e) { }
        }

        // 5. सेक्शन 1: लाइव रिज़ल्ट मंगाना
        async function fetchSingleGame(gameId, openTime, closeTime) {
            let resBox = document.getElementById(`res-${gameId}`);
            try {
                let res = await fetch(`${databaseURL}/results/${gameId}.json?t=${new Date().getTime()}`);
                let data = await res.json();
                
                let showLoading = false;
                if(data && data.updatedAt) {
                    showLoading = isTimeForAutoLoading(openTime, data.updatedAt) || isTimeForAutoLoading(closeTime, data.updatedAt);
                } else {
                    showLoading = isTimeForAutoLoading(openTime, null) || isTimeForAutoLoading(closeTime, null);
                }

                if (showLoading) {
                    resBox.innerHTML = '<span class="auto-loading">LOADING...</span>';
                    return;
                }

                if (data && data.result) {
                    let txt = data.result.trim().toUpperCase();
                    if (txt.includes("WAIT") || txt.includes("LOAD")) {
                        resBox.innerHTML = `<span class="waiting">${data.result}</span>`;
                    } else {
                        resBox.innerHTML = data.result; 
                    }
                } else {
                    resBox.innerHTML = '<span class="waiting">WAITING...</span>';
                }
            } catch (e) { }
        }

        // 6. सेक्शन 2: पुरानी और आज की हिस्ट्री मंगाना (Yesterday & Today)
        async function loadHistorySection() {
            let tbody = document.getElementById('historyBody');
            
            // YYYY-MM-DD फॉर्मेट बनाना
            let today = new Date();
            let yest = new Date(); yest.setDate(yest.getDate() - 1);
            let todayStr = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, '0') + "-" + String(today.getDate()).padStart(2, '0');
            let yestStr = yest.getFullYear() + "-" + String(yest.getMonth() + 1).padStart(2, '0') + "-" + String(yest.getDate()).padStart(2, '0');

            let html = '';
            for (let game of games) {
                let yRes = "***", tRes = "***";
                
                // कल का रिज़ल्ट
                try {
                    let reqY = await fetch(`${databaseURL}/history/${game.id}/${yestStr}.json?t=${new Date().getTime()}`);
                    let dataY = await reqY.json();
                    if(dataY && dataY.result) yRes = dataY.result;
                } catch(e){}
                
                // आज का रिज़ल्ट
                try {
                    let reqT = await fetch(`${databaseURL}/history/${game.id}/${todayStr}.json?t=${new Date().getTime()}`);
                    let dataT = await reqT.json();
                    if(dataT && dataT.result) tRes = dataT.result;
                } catch(e){}

                html += `<tr>
                            <td>${game.name}</td>
                            <td class="yest-res">${yRes}</td>
                            <td class="today-res">${tRes}</td>
                        </tr>`;
            }
            tbody.innerHTML = html;
        }

        function fetchAllData() {
            fetchNotification();
            games.forEach(g => fetchSingleGame(g.id, g.openTime, g.closeTime));
            loadHistorySection();
        }

        window.onload = () => {
            initPage();
            // हर 1 मिनट में पेज खुद चेक करेगा कि 10 मिनट पहले 'LOADING' चालू करना है या नहीं
            setInterval(() => {
                games.forEach(g => fetchSingleGame(g.id, g.openTime, g.closeTime));
            }, 60000);
        };
    </script>
</body>
</html>
