<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBBOSS ROYAL MATKA</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 0; }
        
        /* Header & Logo */
        .header { background: linear-gradient(45deg, #3b0066, #6a1b9a); padding: 20px 10px; text-align: center; border-bottom: 3px solid #ffd700; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .logo { font-size: 30px; font-weight: 900; color: #ffd700; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); letter-spacing: 1px; margin: 0; }
        .sub-logo { font-size: 13px; color: #ffffff; letter-spacing: 2px; margin-top: 5px; font-weight: bold; }

        /* Notification Bar */
        .notification-bar { background-color: #dc3545; color: #fff; padding: 10px 15px; font-size: 16px; font-weight: bold; display: none; align-items: center; border-bottom: 2px solid #fff; }
        .bell-icon { margin-right: 10px; animation: ring 1s infinite alternate; font-size: 18px; }
        @keyframes ring { 0% { transform: rotate(-15deg); } 100% { transform: rotate(15deg); } }

        /* Container */
        .container { padding: 20px 15px; display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: auto; }

        /* Game Card */
        .game-card { background: #1e1e2f; border: 2px solid #6a1b9a; border-radius: 12px; padding: 20px 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .game-name { font-size: 24px; font-weight: 900; color: #ffd700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .game-result { font-size: 36px; font-weight: 900; color: #00ffcc; margin: 15px 0; min-height: 45px; text-shadow: 1px 1px 5px rgba(0, 255, 204, 0.4); }
        
        .waiting { color: #ffeb3b; font-size: 22px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Buttons */
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .refresh-btn { background-color: #28a745; color: white; border: 2px solid #1e7e34; padding: 12px; font-size: 16px; font-weight: 900; border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .refresh-btn:active { background-color: #1e7e34; transform: scale(0.98); }
        .chart-btn { background-color: #ffc107; color: #000; border: 2px solid #d39e00; text-decoration: none; padding: 12px; font-size: 16px; font-weight: 900; border-radius: 8px; display: block; transition: 0.2s; text-transform: uppercase; }
        .chart-btn:active { background-color: #d39e00; transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="logo">👑 SBBOSS ROYAL MATKA 👑</h1>
        <div class="sub-logo">FASTEST SATTA MATKA RESULTS SITE</div>
    </div>

    <div class="notification-bar" id="notiBar">
        <span class="bell-icon">🔔</span>
        <marquee id="notiText" scrollamount="6"></marquee>
    </div>

    <div class="container" id="gamesContainer">
        <!-- Javascript automatically will create cards here -->
    </div>

    <script>
        const databaseURL = "https://sbboss-75e3f-default-rtdb.firebaseio.com";
        
        // सभी 9 गेम्स की सही लिस्ट
        const games = [
            { id: "royal-morning", name: "ROYAL MORNING", chart: "royal-morning-chart.html" },
            { id: "kalyan-morning", name: "KALYAN MORNING", chart: "kalyan-morning-chart.html" },
            { id: "royal-day", name: "ROYAL DAY", chart: "royal-day-chart.html" },
            { id: "main-bazar-day", name: "MAIN BAZAR DAY", chart: "main-bazar-day-chart.html" },
            { id: "kalyan", name: "KALYAN", chart: "kalyan-chart.html" },
            { id: "royal-night", name: "ROYAL NIGHT", chart: "royal-night-chart.html" },
            { id: "kalyan-night", name: "KALYAN NIGHT", chart: "kalyan-night-chart.html" },
            { id: "rajdhani-night", name: "RAJDHANI NIGHT", chart: "rajdhani-night-chart.html" },
            { id: "main-bazar", name: "MAIN BAZAR", chart: "main-bazar-chart.html" }
        ];

        function initGames() {
            const container = document.getElementById('gamesContainer');
            let html = '';
            games.forEach(game => {
                html += `
                <div class="game-card">
                    <div class="game-name">${game.name}</div>
                    <div class="game-result" id="res-${game.id}"><span class="waiting">LOADING...</span></div>
                    <div class="btn-group">
                        <button class="refresh-btn" onclick="fetchSingleGame('${game.id}')">🔄 REFRESH NOW</button>
                        <a href="${game.chart}" class="chart-btn">📊 CHART</a>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            fetchAllData(); 
        }

        async function fetchNotification() {
            try {
                let res = await fetch(`${databaseURL}/notification.json?t=${new Date().getTime()}`);
                let data = await res.json();
                let notiBar = document.getElementById('notiBar');
                let notiText = document.getElementById('notiText');
                
                if (data && data.message && data.message.trim() !== "") {
                    notiText.innerText = data.message;
                    notiBar.style.display = "flex";
                } else {
                    notiBar.style.display = "none";
                }
            } catch (e) { console.log(e); }
        }

        async function fetchSingleGame(gameId) {
            let resBox = document.getElementById(`res-${gameId}`);
            let oldText = resBox.innerHTML;
            resBox.innerHTML = '<span class="waiting">🔄...</span>';
            
            try {
                let res = await fetch(`${databaseURL}/results/${gameId}.json?t=${new Date().getTime()}`);
                let data = await res.json();
                if (data && data.result) {
                    let txt = data.result.trim().toUpperCase();
                    if (txt.includes("WAIT") || txt.includes("LOAD") || txt.includes("UPDATE")) {
                        resBox.innerHTML = `<span class="waiting">${data.result}</span>`;
                    } else {
                        resBox.innerHTML = data.result; 
                    }
                } else {
                    resBox.innerHTML = '<span class="waiting">WAITING...</span>';
                }
            } catch (e) { 
                resBox.innerHTML = oldText; 
            }
        }

        function fetchAllData() {
            fetchNotification();
            games.forEach(game => fetchSingleGame(game.id));
        }

        window.onload = initGames;
    </script>
</body>
</html>
