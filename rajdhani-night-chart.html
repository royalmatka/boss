<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajdhani Night Chart</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff !important;
            margin: 0;
            padding: 5px;
            text-align: center;
        }
        /* चार्ट का नाम (Title) */
        h2.chart-title {
            color: #800080;
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: bold;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            background-color: #ffffff !important;
            border: 2px solid #800080 !important; /* पर्पल बॉर्डर */
        }
        th, td {
            border: 1px solid #800080 !important;
            padding: 8px 2px;
            font-size: 17px;
            text-align: center;
            font-weight: 900;
            background-color: #ffffff !important;
        }
        th {
            background-color: #f8f9fa !important;
            color: #800080;
            font-size: 14px;
        }
        .date-col {
            color: #333333 !important;
            font-size: 10px;
            font-weight: bold;
            width: 60px;
            line-height: 1.2;
            padding: 4px 1px;
            vertical-align: middle;
        }
        /* नॉर्मल नंबर (सिर्फ काले) */
        .normal-num {
            color: #000000 !important;
        }
        /* रेड जोड़ी (सिर्फ लाल) */
        .red-num {
            color: #ff0000 !important;
        }
        /* डैश और खाली जगह */
        .dash-num {
            color: #000000 !important;
        }
    </style>
</head>
<body>

    <!-- सबसे ऊपर चार्ट का नाम -->
    <h2 class="chart-title">Rajdhani Night Chart</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                </tr>
            </thead>
            <!-- एडमिन पैनल का डेटा और बॉक्स यहाँ जावास्क्रिप्ट (JS) द्वारा अपने आप जनरेट होंगे -->
            <tbody id="auto-chart-body">
            </tbody>
        </table>
    </div>

    <script>
        // 1. आपका पूरा डेटा (Rajdhani Night - 5 Days a week)
        const baseData = [
            "73","59","19","46","86",
            "28","83","76","23","71",
            "77","40","16","83","00",
            "48","31","34","41","14",
            "20","04","09","16","45",
            "60","55","73","58","**",
            "92","13","64","15","07",
            "89","50","12","74","91",
            "65","20","69","20","65",
            "26","59","02","25","07",
            "51","47","76","98","20",
            "50","58","42","81","52",
            "57","83","62","05","39",
            "71","71","61","09","58",
            "38","20","64","54","85",
            "**","**","**","**","**",
            "06","64","36","32","48",
            "04","63","52","00","32",
            "40","92","89","81","10",
            "29","05","03","87","43",
            "19","35","38","36","81",
            "20","00","17","57","45",
            "42","92","43","57","22",
            "37","86","27","80","85",
            "41","76","67","47","27",
            "63","75","71","05","64",
            "86","73","34","46","67",
            "33","09","08","84","62",
            "35","86","20","96","59",
            "**","30","23","83","52",
            "28","55","20","73","87",
            "82","93","22","34","30",
            "46","29","38","92","65",
            "76","39","48","53","09",
            "47","03","**","48","65",
            "16","56","05","43","09",
            "56","21","02","02","38",
            "34","46","03","46","64",
            "90","87","97","12","66",
            "70","02","98","82","78",
            "06","43","45","77","85",
            "00","58","53","71","68",
            "63","85","71","29","27",
            "71","34","48","25","66",
            "79","04","68","01","85",
            "79","96","22","30","93",
            "11","37","78","05","06",
            "89","80","82","11","48",
            "56","67","76","69","33",
            "15","50","42","41","90",
            "21","04","33","55","19",
            "95","04","47","34","22",
            "84","36","21","60","69",
            "41","47","18","90","63",
            "96","64","60","81","78"
        ];

        // 2. एडमिन पैनल का डेटाबेस नाम (राजधानी नाईट के लिए खास नाम 'rajdhaniNightAdminData')
        let adminData = JSON.parse(localStorage.getItem('rajdhaniNightAdminData')) || [];
        let allData = baseData.concat(adminData);

        // 3. 5-दिन वाले चार्ट का ऑटोमैटिक जनरेटर
        function generateDynamicChart() {
            const tbody = document.getElementById('auto-chart-body');
            tbody.innerHTML = '';
            
            // शुरू होने की तारीख (07 जुलाई 2025)
            // (महीना 0 से शुरू होता है इसलिए जुलाई = 6)
            let startDate = new Date(2025, 6, 7); 

            // लूप को 5-5 दिन के हिसाब से चलाया है (क्योंकि यह 5 दिन का गेम है)
            for (let i = 0; i < allData.length; i += 5) {
                let tr = document.createElement('tr');

                // ऑटोमैटिक डेट (Date) बनाना 
                let weekStart = new Date(startDate);
                weekStart.setDate(weekStart.getDate() + (i / 5) * 7);
                
                // हफ्ता शुक्रवार को खत्म होगा (सोमवार + 4 दिन = शुक्रवार)
                let weekEnd = new Date(weekStart);
                weekEnd.setDate(weekStart.getDate() + 4); 

                let startStr = ('0' + weekStart.getDate()).slice(-2) + '/' + ('0' + (weekStart.getMonth()+1)).slice(-2) + '/' + String(weekStart.getFullYear()).slice(-2);
                let endStr = ('0' + weekEnd.getDate()).slice(-2) + '/' + ('0' + (weekEnd.getMonth()+1)).slice(-2) + '/' + String(weekEnd.getFullYear()).slice(-2);

                let tdDate = document.createElement('td');
                tdDate.className = 'date-col';
                tdDate.innerHTML = startStr + '<br>to<br>' + endStr;
                tr.appendChild(tdDate);

                // सोमवार से शुक्रवार (5 दिन) के बॉक्स
                for (let j = 0; j < 5; j++) {
                    let val = allData[i + j];
                    let td = document.createElement('td');
                    let span = document.createElement('span');

                    if (val === undefined || val === '' || val === '--') {
                        span.innerText = '--';
                        span.className = 'dash-num';
                    } else if (val === '**') {
                        span.innerText = val;
                        span.className = 'red-num';
                    } else {
                        span.innerText = val;
                        // ऑटोमैटिक रेड जोड़ी (0 या 5 का अंतर) पकड़ने का लॉजिक
                        if (val.length === 2 && !isNaN(val)) {
                            let diff = Math.abs(parseInt(val[0]) - parseInt(val[1]));
                            if (diff === 0 || diff === 5) {
                                span.className = 'red-num';
                            } else {
                                span.className = 'normal-num';
                            }
                        } else {
                            span.className = 'normal-num';
                        }
                    }
                    td.appendChild(span);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        // चार्ट को लोड करना
        generateDynamicChart();
    </script>

</body>
</html>
