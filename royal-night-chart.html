<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Night Chart</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff !important;
            margin: 0;
            padding: 5px;
            text-align: center;
        }
        /* चार्ट का नाम (Title) */
        h2.chart-title {
            color: #800080;
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: bold;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            background-color: #ffffff !important;
            border: 2px solid #800080 !important; /* पर्पल बॉर्डर */
        }
        th, td {
            border: 1px solid #800080 !important;
            padding: 8px 2px;
            font-size: 17px;
            text-align: center;
            font-weight: 900;
            background-color: #ffffff !important;
        }
        th {
            background-color: #f8f9fa !important;
            color: #800080;
            font-size: 14px;
        }
        .date-col {
            color: #333333 !important;
            font-size: 10px;
            font-weight: bold;
            width: 60px;
            line-height: 1.2;
            padding: 4px 1px;
            vertical-align: middle;
        }
        /* नॉर्मल नंबर (सिर्फ काले) */
        .normal-num {
            color: #000000 !important;
        }
        /* रेड जोड़ी (सिर्फ लाल) */
        .red-num {
            color: #ff0000 !important;
        }
        /* डैश और खाली जगह */
        .dash-num {
            color: #000000 !important;
        }
    </style>
</head>
<body>

    <!-- सबसे ऊपर चार्ट का नाम -->
    <h2 class="chart-title">Royal Night Chart</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                    <th>Sat</th>
                </tr>
            </thead>
            <!-- एडमिन पैनल का डेटा और बॉक्स यहाँ जावास्क्रिप्ट (JS) द्वारा अपने आप जनरेट होंगे -->
            <tbody id="auto-chart-body">
            </tbody>
        </table>
    </div>

    <script>
        // 1. आपका पूरा डेटा (Royal Night - 6 Days a week)
        const baseData = [
            "18","60","51","64","49","33",
            "78","04","52","11","91","43",
            "13","90","82","86","73","00",
            "19","14","27","39","10","27",
            "52","84","58","89","47","60",
            "40","85","08","80","68","32",
            "51","57","29","63","05","63",
            "**","89","73","43","47","57",
            "26","86","94","24","25","99",
            "14","92","47","41","20","29",
            "81","17","60","07","87","45",
            "76","48","08","66","46","16",
            "56","09","51","87","64","98",
            "99","57","59","87","31","28",
            "26","38","28","21","05","48",
            "52","60","62","08","70","43",
            "06","51","00","84","32","51",
            "69","47","83","90","16","02",
            "19","98","83","49","47","69",
            "60","57","42","91","73","21",
            "19","47","85","75","33","17",
            "83","61","55","97","43","66",
            "83","14","54","62","12","19",
            "03","79","70","45","69","07",
            "83","37","39","22","83","35",
            "61","51","82","78","47","70",
            "47","26","66","17","86","89",
            "10","13","59","95","01","93",
            "51","93","86","54","29","83",
            "09","88","51","32","17","69",
            "49","38","78","27","10","17",
            "52","70","14","80","48","83",
            "18","82","02","65","55","62",
            "52","60","65","00","90","65",
            "70","88","11","44","53","91",
            "20","96","81","81","60","17",
            "19","27","71","47","41","66",
            "34","14","24","79","59","70",
            "42","66","20","46","28","08",
            "32","87","89","89","**","08",
            "31","92","87","02","86","61",
            "09","18","12","04","35","92",
            "12","59","77","97","96","42",
            "59","46","42","54","33","95",
            "19","87","06","34","**","01",
            "68","92","77","01","41","41",
            "38","11","50","26","27","47",
            "95","31","00","28","31","23",
            "51","23","55","57","54","52",
            "10","37","64","37","58","95",
            "94","12","61","73","78","87",
            "23","34","40","11","01","67",
            "78","85","99","52","28","59" // <--- जब नया नंबर आए, तो यहाँ कॉमा (,) लगाकर अगला नंबर लिख देना
        ];

        // 2. एडमिन पैनल का डेटाबेस नाम (Royal Night के लिए खास नाम 'royalNightAdminData')
        let adminData = JSON.parse(localStorage.getItem('royalNightAdminData')) || [];
        let allData = baseData.concat(adminData);

        // 3. 6-दिन वाले चार्ट का ऑटोमैटिक जनरेटर
        function generateDynamicChart() {
            const tbody = document.getElementById('auto-chart-body');
            tbody.innerHTML = '';
            
            // शुरू होने की तारीख (07 जुलाई 2025)
            // (महीना 0 से शुरू होता है इसलिए जुलाई = 6)
            let startDate = new Date(2025, 6, 7); 

            // लूप को 6-6 दिन के हिसाब से चलाया है (क्योंकि यह 6 दिन का गेम है)
            for (let i = 0; i < allData.length; i += 6) {
                let tr = document.createElement('tr');

                // ऑटोमैटिक डेट (Date) बनाना
                let weekStart = new Date(startDate);
                weekStart.setDate(weekStart.getDate() + (i / 6) * 7);
                let weekEnd = new Date(weekStart);
                
                // 6 दिन के गेम में हफ्ता शनिवार को खत्म होता है, इसलिए +5 दिन जोड़े हैं
                weekEnd.setDate(weekStart.getDate() + 5); 

                let startStr = ('0' + weekStart.getDate()).slice(-2) + '/' + ('0' + (weekStart.getMonth()+1)).slice(-2) + '/' + String(weekStart.getFullYear()).slice(-2);
                let endStr = ('0' + weekEnd.getDate()).slice(-2) + '/' + ('0' + (weekEnd.getMonth()+1)).slice(-2) + '/' + String(weekEnd.getFullYear()).slice(-2);

                let tdDate = document.createElement('td');
                tdDate.className = 'date-col';
                tdDate.innerHTML = startStr + '<br>to<br>' + endStr;
                tr.appendChild(tdDate);

                // सोमवार से शनिवार (6 दिन) के बॉक्स
                for (let j = 0; j < 6; j++) {
                    let val = allData[i + j];
                    let td = document.createElement('td');
                    let span = document.createElement('span');

                    if (val === undefined || val === '' || val === '--') {
                        span.innerText = '--';
                        span.className = 'dash-num';
                    } else if (val === '**') {
                        span.innerText = val;
                        span.className = 'red-num';
                    } else {
                        span.innerText = val;
                        // ऑटोमैटिक रेड जोड़ी (0 या 5 का अंतर) पकड़ने का लॉजिक
                        if (val.length === 2 && !isNaN(val)) {
                            let diff = Math.abs(parseInt(val[0]) - parseInt(val[1]));
                            if (diff === 0 || diff === 5) {
                                span.className = 'red-num';
                            } else {
                                span.className = 'normal-num';
                            }
                        } else {
                            span.className = 'normal-num';
                        }
                    }
                    td.appendChild(span);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        // चार्ट को लोड करना
        generateDynamicChart();
    </script>

</body>
</html>
