<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Night Chart</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #ffffff !important; margin: 0; padding: 5px; text-align: center; }
        h2.chart-title { color: #800080; margin-top: 15px; margin-bottom: 15px; font-size: 24px; font-weight: bold; text-transform: uppercase; }
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin: 0 auto; background-color: #ffffff !important; border: 2px solid #800080 !important; }
        th, td { border: 1px solid #800080 !important; padding: 8px 2px; font-size: 17px; text-align: center; font-weight: 900; background-color: #ffffff !important; }
        th { background-color: #f8f9fa !important; color: #800080; font-size: 14px; text-transform: uppercase; }
        .date-col { color: #333333 !important; font-size: 10px; font-weight: bold; width: 60px; line-height: 1.2; padding: 4px 1px; vertical-align: middle; }
        .normal-num { color: #000000 !important; }
        .red-num { color: #ff0000 !important; }
        .dash-num { color: #000000 !important; }
    </style>
</head>
<body>
    <h2 class="chart-title">Royal Night Chart</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
                </tr>
            </thead>
            <tbody id="auto-chart-body"></tbody>
        </table>
    </div>

    <script>
        // आपका असली 55 हफ़्ते का Royal Night का डेटा
        const baseData = [
            "18","27","74","10","44","84",
            "20","71","19","27","67","06",
            "92","93","46","26","33","51",
            "77","11","85","07","08","24",
            "24","82","30","40","93","31",
            "20","99","11","29","80","23",
            "14","21","84","32","79","58",
            "83","08","22","92","19","64",
            "00","32","48","68","22","90",
            "76","15","93","30","84","47",
            "44","57","16","82","17","51",
            "63","40","24","51","75","60",
            "15","48","74","51","89","87",
            "15","82","35","04","88","96",
            "25","02","77","79","29","69",
            "73","38","47","40","66","82",
            "14","96","60","17","50","12",
            "27","79","32","80","84","08",
            "31","77","55","27","77","24",
            "54","95","30","73","30","59",
            "57","59","41","68","94","37",
            "22","03","33","06","80","71",
            "29","93","97","33","86","82",
            "51","03","52","68","26","03",
            "89","80","20","49","63","74",
            "87","30","32","02","16","02",
            "24","29","86","15","43","40",
            "09","84","78","28","90","22",
            "68","59","02","53","18","34",
            "81","95","55","51","65","69",
            "59","62","12","70","51","31",
            "69","98","87","66","24","64",
            "90","16","62","27","52","05",
            "43","91","07","89","25","17",
            "28","82","27","30","22","17",
            "00","13","36","51","88","95",
            "98","49","90","50","59","95",
            "48","74","68","68","72","18",
            "40","63","98","21","65","37",
            "37","35","62","46","15","65",
            "99","40","88","75","73","06",
            "50","98","82","02","77","36",
            "83","73","10","38","30","65",
            "79","98","50","10","69","27",
            "50","13","24","36","33","23",
            "86","28","85","31","18","50",
            "28","95","27","44","93","35",
            "52","00","83","58","70","09",
            "93","87","08","08","35","41",
            "47","26","66","17","86","89",
            "10","13","59","95","01","93",
            "51","93","86","54","29","83",
            "09","88","51","32","17","69",
            "21","04","10","37","57","39",
            "98","48","64","85","93","00"
        ];

        const databaseURL = "https://sbboss-75e3f-default-rtdb.firebaseio.com";
        const gameName = "royal-night"; 
        const daysInWeek = 6; 
        const startDate = new Date(2025, 6, 7); 
        let allData = [...baseData]; 

        function extractJodi(fullResult) {
            if (!fullResult) return null;
            let text = fullResult.trim().toUpperCase();
            if (text.includes("WAIT") || text.includes("LOAD") || text.includes("UPDATE") || text.includes("RESULT")) return null;
            let jodi = "";
            let parts = text.split('-');
            if (parts.length === 3) { jodi = parts[1].trim(); } 
            else if (parts.length === 2) { jodi = parts[1].trim(); } 
            else if (parts.length === 1) { jodi = parts[0].trim(); } 
            else { return null; }
            if (/^\d{1,2}$/.test(jodi) || jodi === "**") return jodi;
            return null;
        }

        function getExactBoxIndex(dateString) {
            let parts = dateString.split('-');
            let d = new Date(parts[0], parts[1]-1, parts[2]);
            let start = new Date(startDate);
            d.setHours(0,0,0,0); start.setHours(0,0,0,0);
            let diffTime = d - start;
            let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return -1;
            let weeksPassed = Math.floor(diffDays / 7);
            let dayOfWeek = d.getDay(); 
            let dayIndex = (dayOfWeek === 0) ? 6 : dayOfWeek - 1;
            if (dayIndex >= daysInWeek) return -1;
            return (weeksPassed * daysInWeek) + dayIndex;
        }

        async function fetchAdminData() {
            try {
                let url = `${databaseURL}/history/${gameName}.json?t=${new Date().getTime()}`;
                let response = await fetch(url);
                if(response.ok) {
                    let data = await response.json();
                    if (data) {
                        let sortedDates = Object.keys(data).sort();
                        sortedDates.forEach(date => {
                            let jodi = extractJodi(data[date].result);
                            if(jodi !== null) { 
                                let exactIndex = getExactBoxIndex(date);
                                if (exactIndex !== -1) {
                                    while (allData.length <= exactIndex) { allData.push("--"); }
                                    allData[exactIndex] = jodi; 
                                }
                            }
                        });
                    }
                }
            } catch (error) { console.error("Firebase Error:", error); }
            generateDynamicChart();
        }

        function generateDynamicChart() {
            const tbody = document.getElementById('auto-chart-body');
            tbody.innerHTML = '';
            let totalBoxes = Math.max(allData.length, daysInWeek); 
            let rowsToMake = Math.ceil(totalBoxes / daysInWeek);
            if (rowsToMake === 0) rowsToMake = 1;

            for (let i = 0; i < (rowsToMake * daysInWeek); i += daysInWeek) {
                let tr = document.createElement('tr');
                let weekStart = new Date(startDate);
                weekStart.setDate(weekStart.getDate() + (i / daysInWeek) * 7);
                let weekEnd = new Date(weekStart);
                weekEnd.setDate(weekStart.getDate() + (daysInWeek - 1)); 
                let startStr = ('0' + weekStart.getDate()).slice(-2) + '/' + ('0' + (weekStart.getMonth()+1)).slice(-2) + '/' + String(weekStart.getFullYear()).slice(-2);
                let endStr = ('0' + weekEnd.getDate()).slice(-2) + '/' + ('0' + (weekEnd.getMonth()+1)).slice(-2) + '/' + String(weekEnd.getFullYear()).slice(-2);
                
                let tdDate = document.createElement('td');
                tdDate.className = 'date-col';
                tdDate.innerHTML = startStr + '<br>to<br>' + endStr;
                tr.appendChild(tdDate);

                for (let j = 0; j < daysInWeek; j++) {
                    let val = allData[i + j];
                    let td = document.createElement('td');
                    let span = document.createElement('span');
                    
                    if (val === undefined || val === '' || val === '--') {
                        span.innerText = '--'; span.className = 'dash-num';
                    } else if (val === '**') {
                        span.innerText = val; span.className = 'red-num';
                    } else {
                        span.innerText = (val.length === 1) ? "0" + val : val;
                        if (span.innerText.length === 2 && !isNaN(span.innerText)) {
                            let diff = Math.abs(parseInt(span.innerText[0]) - parseInt(span.innerText[1]));
                            span.className = (diff === 0 || diff === 5) ? 'red-num' : 'normal-num';
                        } else { span.className = 'normal-num'; }
                    }
                    td.appendChild(span);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }
        fetchAdminData();
    </script>
</body>
</html>
